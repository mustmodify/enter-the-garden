{%- assign p = include.phase | modulo: 8 -%}
<svg class="moon" viewBox="-12 -12 24 24" width="{{ include.size | default: 28 }}" height="{{ include.size | default: 28 }}" aria-hidden="true" focusable="false">
  <mask id="mk{{ p }}" maskUnits="userSpaceOnUse" x="-12" y="-12" width="24" height="24">
    <rect x="-12" y="-12" width="24" height="24" fill="#fff"/>
    {%- case p -%}
      {%- when 0 -%}<circle r="10.5" fill="#000"/>
      {%- when 1 -%}<circle cx="-7" r="10.2" fill="#000"/>
      {%- when 2 -%}<rect x="-12" y="-12" width="12" height="24" fill="#000"/>
      {%- when 3 -%}<circle cx="-16" r="10.2" fill="#000"/>
      {%- when 5 -%}<circle cx="16" r="10.2" fill="#000"/>
      {%- when 6 -%}<rect x="0" y="-12" width="12" height="24" fill="#000"/>
      {%- when 7 -%}<circle cx="7" r="10.2" fill="#000"/>
    {%- endcase -%}
  </mask>
  <circle r="10" class="moon-lit" mask="url(#mk{{ p }})"/>
  <circle r="10" class="moon-ring"/>
</svg>
